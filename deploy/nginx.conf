# 中文：网关限制请求体，并在转发前清除所有客户端伪造的代理身份头。
# English: The gateway limits request bodies and strips every client-forged proxy identity header.
server {
    listen 80;
    server_name _;

    client_max_body_size 55m;
    proxy_request_buffering on;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID "";
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-Roles "";
        proxy_set_header X-Source-IDs "";
        proxy_set_header X-Group-IDs "";
        proxy_set_header X-Auth-Proxy-Secret "";
        proxy_set_header X-Enterprise-RAG-Proxy-Secret "";
    }
}
