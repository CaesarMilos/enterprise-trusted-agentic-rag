[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "enterprise-trusted-agentic-rag"
version = "0.3.0rc2"
description = "A trusted Agentic RAG assistant for enterprise knowledge bases."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Weihan Hu" }]
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "numpy>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
  "pypdf>=6.0,<7.0",
  "python-dotenv>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "PyYAML>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "streamlit>=1.46,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]
local-models = [
  "faiss-cpu>=1.11,<2.0",
  "sentence-transformers>=5.0,<6.0",
]
ocr = [
  "Pillow>=11.0,<13.0",
  "PyMuPDF>=1.25,<2.0",
  "pytesseract>=0.3.13,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["enterprise_rag"]

[[tool.mypy.overrides]]
module = [
  "PIL.*",
  "faiss",
  "fitz",
  "pytesseract",
  "sentence_transformers.*",
  "streamlit",
  "yaml",
]
ignore_missing_imports = true
