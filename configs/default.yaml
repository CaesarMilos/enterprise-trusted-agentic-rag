config_version: "5.0"
application:
  name: enterprise-trusted-agentic-rag
  environment: production

storage:
  upload_dir: data/uploads
  index_dir: data/indexes
  trace_dir: data/traces
  database_url: sqlite:///./data/database/enterprise_rag.db

ingestion:
  allowed_extensions: [pdf, md, txt]
  max_file_size_mb: 50
  chunker_version: structure-constrained-adaptive-v4
  min_chunk_tokens: 150
  target_chunk_tokens: 400
  max_chunk_tokens: 700
  semantic_boundary_threshold: 0.52
  semantic_ambiguity_margin: 0.08
  boundary_structure_weight: 0.30
  boundary_semantic_weight: 0.30
  boundary_length_weight: 0.20
  boundary_marker_weight: 0.10
  boundary_role_weight: 0.10
  adaptive_boundary_threshold: 0.58
  llm_boundary_enabled: false
  llm_boundary_max_calls: 8
  parent_chunks_enabled: true
  embedding_text_max_tokens: 384
  index_heading_max_depth: 2
  index_heading_max_characters: 96
  max_exact_duplicate_vector_group: 3
  max_harmful_duplicate_vector_ratio: 0.01
  job_lease_seconds: 300
  job_heartbeat_seconds: 60
  max_request_body_size_mb: 55

embedding:
  provider: local
  model: BAAI/bge-small-zh-v1.5
  dimension: 0
  batch_size: 32
  base_url: null
  api_key_env: EMBEDDING_API_KEY

ocr:
  enabled: false
  provider: tesseract
  language: chi_sim+eng
  dpi: 250
  minimum_confidence: 0.75

retrieval:
  dense_candidate_k: 30
  bm25_candidate_k: 30
  rrf_k: 60
  min_k: 3
  default_k: 5
  max_k: 16
  reranker_enabled: true
  reranker_model: BAAI/bge-reranker-base
  context_token_budget: 6000
  max_parent_tokens: 1600
  max_children_per_parent: 2
  max_document_share: 0.6

content_contract:
  schema_version: source-contract-v1
  automatic_profile_min_confidence: 0.70
  profile_mismatch_confidence: 0.80
  default_enforcement_mode: warn
  profiler_min_sample_characters: 2000
  profiler_max_sample_characters: 30000

snapshot:
  ttl_seconds: 120
  maximum_ttl_seconds: 300
  cleanup_grace_seconds: 30

question_plan:
  schema_version: question-plan-v1
  max_total_needs: 16
  max_required_needs: 12
  max_anchors: 32
  max_dependency_depth: 4
  maximum_rewrite_drift: 0.75

providers:
  allow_lexical_only_publication: true
  executor_workers: 4
  executor_queue_capacity: 8
  circuit_breaker_failure_threshold: 5
  circuit_breaker_reset_seconds: 30

traces:
  default_level: summary
  summary_retention_days: 30
  diagnostic_retention_days: 14
  ranked_candidate_limit: 100

compatibility:
  api_v1_enabled: true
  legacy_profile_read_enabled: true
  legacy_status_projection_enabled: true
  write_legacy_status_during_transition: true

agent:
  max_retrieval_retries: 2
  max_model_calls: 8
  max_total_tokens: 24000
  timeout_seconds: 60

llm:
  provider: openai-compatible
  model: gpt-4.1-mini
  base_url: http://localhost:11434/v1
  api_key_env: LLM_API_KEY
  request_timeout_seconds: 45
  temperature: 0.0

security:
  default_tenant_id: demo-tenant
  enforce_access_scope: true
  authentication_mode: trusted_proxy
  demo_auth_enabled: false
  trusted_proxy_auth_enabled: true
  trusted_proxy_secret_env: ENTERPRISE_RAG_PROXY_SECRET
  trusted_proxy_secret_header: X-Enterprise-RAG-Proxy-Secret
  jwt_secret_env: ENTERPRISE_RAG_JWT_SECRET
  jwt_issuer: enterprise-rag
  jwt_audience: enterprise-rag-api
